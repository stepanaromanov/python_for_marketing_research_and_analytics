# ============================================================
# Marketing Analytics Portfolio — Conda Environment
# Python 3.12
#
# Create : conda env create -f environment.yml
# Activate: conda activate marketing-portfolio
# Update  : conda env update -f environment.yml --prune
# Export  : conda env export > environment_lock.yml
# Remove  : conda env remove -n marketing-portfolio
#
# Note: PyMC 6 and Google Meridian coexist here via conda.
# PyMC 6 uses the new split arviz packages (arviz-base/stats/plots).
# Meridian uses the legacy arviz==0.19.0 shim.
# Conda installs both — do NOT replicate this with pip only.
# ============================================================
name: marketing-portfolio
channels:
  - conda-forge       # preferred — better package resolution
  - defaults
dependencies:
  # ── Python ────────────────────────────────────────────────
  - python=3.12

  # ── Core data stack ───────────────────────────────────────
  - numpy=2.3.5           # TF 2.18+ supports NumPy 2.x natively
  - pandas=2.3.3
  - scipy=1.16.3

  # ── Visualisation ─────────────────────────────────────────
  - matplotlib=3.10.6
  - seaborn=0.13.2
  - plotly=5.24.1
  - altair=6.0.0
  - plotnine=0.15.3

  # ── Graph ─────────────────────────────────────────────────
  - networkx=3.6.1

  # ── Machine learning ──────────────────────────────────────
  - scikit-learn=1.8.0

  # ── Statistics ────────────────────────────────────────────
  - statsmodels=0.14.6

  # ── Bayesian ──────────────────────────────────────────────
  - pymc=6.0.0
  - arviz-base=1.1.0        # new split package — used by PyMC 6
  - arviz-stats=1.1.0       # new split package — used by PyMC 6
  - arviz-plots=1.1.0       # new split package — used by PyMC 6
  # arviz=0.19.0 (legacy shim for Meridian) installed via pip below —
  # conda cannot hold both 0.19.0 and >=1.1.0 simultaneously

  # ── Notebook environment ──────────────────────────────────
  - jupyterlab=4.2
  - ipywidgets=8.1
  - nbformat=5.10
  - nbconvert=7.16
  - nodejs=20

  # ── Utilities ─────────────────────────────────────────────
  - pyyaml=6.0.3
  - xarray=2026.4.0
  - tqdm=4.67.3
  - git

  # ── pip-only packages ─────────────────────────────────────
  - pip
  - pip:
    # Optimisation
    - pulp==3.3.1
    - highspy==1.14.0
    # Google Meridian MMM — pulls tensorflow 2.20 + tfp-nightly
    # arviz=0.19.0 shim installed first so Meridian's legacy import works
    - arviz==0.19.0
    - google-meridian==1.6.1
    # MLflow
    - mlflow==3.12.0
    # DVC
    - dvc==3.51.0
    # Drift monitoring
    - evidently==0.4.33
    # Causal ML
    - econml==0.16.0
    # Stats
    - pingouin==0.5.4
    # Plotly static export
    - kaleido==0.1.0
    # API serving
    - fastapi==0.136.1
    - uvicorn[standard]==0.46.0
    - pydantic==2.11.5
    # Explainability
    - shap==0.46.0